version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: buildly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  adminer:
    image: adminer:latest
    container_name: buildly_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"   # 🔐 Bind only to localhost
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
